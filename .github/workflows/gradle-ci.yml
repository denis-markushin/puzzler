name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - run: ./gradlew installDist
      - run: ./build/install/puzzler/bin/puzzler --version
      - run: docker build -t puzzler:ci .
      - run: docker run --rm --entrypoint git puzzler:ci --version
      - run: docker run --rm puzzler:ci --version
