[versions]
gradle = "9.1.0"
dema-plugins = "0.7.0"
clikt = "5.0.3"
jackson = "2.18.2"
kotlin-logging = "7.0.5"
assertk = "0.28.1"
junit = "5.11.4"
wiremock = "3.10.0"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
assertk = { module = "com.willowtreeapps.assertk:assertk-jvm", version.ref = "assertk" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }

[plugins]
dema-kotlin = { id = "io.github.denis-markushin.kotlin", version.ref = "dema-plugins" }
dema-spotless = { id = "io.github.denis-markushin.spotless", version.ref = "dema-plugins" }
